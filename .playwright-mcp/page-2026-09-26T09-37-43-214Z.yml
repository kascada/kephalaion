                - generic [ref=f2e80] [cursor=pointer]: Unionsmarken
              - generic [ref=f2e81]:
                - checkbox "internationale Marken" [checked] [ref=f2e82]
                - generic [ref=f2e83] [cursor=pointer]: internationale Marken
          - generic [ref=f2e84]:
            - generic [ref=f2e85] [cursor=pointer]: Marke
            - button "Hilfe zum Feld Marke. Das Eingabefeld betrifft den Text einer Marke, dessen Übersetzung, die Markendarstellung beschreibende Begriffe und sonstige, die Marke beschreibende Angaben. Gesucht werden Marken, deren Attribute alle eingegebenen Begriffe enthalten. Platzhalter und Anführungszeichen sind möglich. Das Fragezeichen steht für kein Zeichen, für ein Zeichen oder mehrere Zeichen, das Ausrufezeichen steht für ein Zeichen, das Nummernzeichen steht für ein Zeichen oder kein Zeichen." [ref=f2e87] [cursor=pointer]: "?"
            - textbox "Marke" [ref=f2e89]:
              - /placeholder: z.B. DPMAdirektWeb
              - text: "?ephala?"
          - generic [ref=f2e90]:
            - generic [ref=f2e91] [cursor=pointer]: Aktenzeichen/Registernummer
            - button "Hilfe zum Feld Registernummer. Das Eingabefeld betrifft die Registernummer bzw. das Aktenzeichen einer Marke. Hier ist entweder eine Registernummer oder ein Aktenzeichen anzugeben. Die Nummer darf kein Leerzeichen enthalten, außer sie steht zwischen Anführungszeichen. Platzhalter sind möglich. Das Fragezeichen steht für kein Zeichen, für ein Zeichen oder mehrere Zeichen, das Ausrufezeichen steht für ein Zeichen, das Nummernzeichen steht für ein Zeichen oder kein Zeichen." [ref=f2e93] [cursor=pointer]: "?"
            - textbox "Aktenzeichen/Registernummer" [ref=f2e95]:
              - /placeholder: z.B. 302016028133
          - generic [ref=f2e96]:
            - generic [ref=f2e97] [cursor=pointer]: Beginn Widerspruchsfrist
            - button "Hilfe zum Feld Beginn Widerspruchsfrist. Die Eingabefelder betreffen das Datum des Beginns der Widerspruchsfrist. Bei nationalen Marken beginnt die Widerspruchsfrist mit dem Tag der Veröffentlichung der Eintragung der Marke. Für Unionsmarken (EM) und internationale Marken (IR) gelten abweichende Bestimmungen. Gesucht werden Marken, deren Widerspruchsfrist am angegebenen Tag oder innerhalb des angegebenen Zeitraums begonnen hat. Die Option Datum ermöglicht die Angabe eines Tages, einer Kalenderwoche, eines Monats, eines Quartals, eines Jahres oder eines Zeitraums, zum Beispiel 04.11.2021, KW44 minus 2021, M11 minus 2021, Q4 minus 2021, J minus 2021 oder 01.01.2023 Doppelpunkt 30.06.2023. Die Option Zeitraum lässt die Angabe eines Startdatums (von) und/oder eines Enddatums (bis) zu. Ohne Enddatum ist der Zeitraum ab dem Startdatum gemeint, ohne Startdatum der Zeitraum vor dem Enddatum." [ref=f2e99] [cursor=pointer]: "?"
            - group "Beginn Widerspruchsfrist" [ref=f2e100]:
              - generic [ref=f2e102]:
                - generic [ref=f2e104] [cursor=pointer]:
                  - radio "Datum" [checked] [ref=f2e105]
                  - text: Datum
                - generic [ref=f2e106]:
