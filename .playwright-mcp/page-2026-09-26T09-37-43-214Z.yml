                  - textbox "Datum" [ref=f2e108]:
                    - /placeholder: z.B. 17.05.2013
              - generic [ref=f2e110]:
                - generic [ref=f2e112] [cursor=pointer]:
                  - radio "Zeitraum (von/bis)" [ref=f2e113]
                  - text: Zeitraum (von/bis)
                - generic [ref=f2e114]:
                  - generic [ref=f2e115] [cursor=pointer]: Zeitraum (von/bis)
                  - textbox "Auswahl Zeitraum von" [disabled] [ref=f2e116]
                - generic [ref=f2e117]:
                  - generic [ref=f2e118] [cursor=pointer]: Zeitraum (von/bis)
                  - textbox "Auswahl Zeitraum bis" [disabled] [ref=f2e119]
          - generic [ref=f2e120]:
            - generic [ref=f2e121] [cursor=pointer]: Markenform
            - button "Hilfe zum Feld Markenform. Das Auswahlfeld betrifft die Form einer Marke. Gesucht werden Marken mit der ausgewählten Markenform (Wortmarke, Wort-/Bildmarke, Bildmarke, Farbmarke, Hörmarke, dreidimensionale Marke, Kennfadenmarke, Klangmarke, Positionsmarke, Mustermarke, Bewegungsmarke, Multimediamarke, Hologrammmarke oder sonstige Marke)." [ref=f2e123] [cursor=pointer]: "?"
            - combobox "Markenform" [ref=f2e125]:
              - option "Alle Markenformen" [selected]
              - option "Wortmarke"
              - option "Wort-/Bildmarke"
              - option "Bildmarke"
              - option "Farbmarke"
              - option "Hörmarke"
              - option "Dreidimensionale Marke"
              - option "Kennfadenmarke"
              - option "Klangmarke"
              - option "Positionsmarke"
              - option "Mustermarke"
              - option "Bewegungsmarke"
              - option "Multimediamarke"
              - option "Hologrammmarke"
              - option "Sonstige Marke"
              - option "Unbekannte Markenform"
          - generic [ref=f2e126]:
            - generic [ref=f2e127] [cursor=pointer]: Anmelder/Inhaber
            - button "Hilfe zum Feld Anmelder/Inhaber. Das Eingabefeld betrifft Angaben zum Anmelder bzw. Inhaber einer Marke. Gesucht werden Marken, deren Angaben zum Anmelder oder zum Inhaber jeweils alle hier eingegebenen Namen oder Adressbestandteile enthalten, zum Beispiel Müller Berlin oder Sport GmbH 12345. Bei nationalen Marken und Unionsmarken (EM) sind Straßennamen und Hausnummern nicht von der Suche umfasst. Platzhalter und Anführungszeichen sind möglich. Das Fragezeichen steht für kein Zeichen, für ein Zeichen oder mehrere Zeichen, das Ausrufezeichen steht für ein Zeichen, das Nummernzeichen steht für ein Zeichen oder kein Zeichen." [ref=f2e129] [cursor=pointer]: "?"
            - textbox "Anmelder/Inhaber" [ref=f2e131]:
              - /placeholder: z.B. Bundesrepublik Deutschland
          - generic [ref=f2e132]:
            - generic [ref=f2e133] [cursor=pointer]: Waren/Dienstleistungen
            - button "Hilfe zum Feld Waren/Dienstleistungen. Das Eingabefeld betrifft die Waren und/oder Dienstleistungen, für die eine Marke angemeldet oder eingetragen worden ist. Gesucht werden Marken, die für alle hier eingegebenen Waren bzw. Dienstleistungen angemeldet oder eingetragen wurden. Platzhalter und Anführungszeichen sind möglich. Das Fragezeichen steht für kein Zeichen, für ein Zeichen oder mehrere Zeichen, das Ausrufezeichen steht für ein Zeichen, das Nummernzeichen steht für ein Zeichen oder kein Zeichen." [ref=f2e135] [cursor=pointer]: "?"
            - textbox "Waren/Dienstleistungen" [ref=f2e137]:
              - /placeholder: z.B. Software
          - generic [ref=f2e138]:
            - generic [ref=f2e139] [cursor=pointer]: Klasse(n)
            - button "Hilfe zum Feld Klasse(n). Das Eingabefeld betrifft die Waren- und Dienstleistungsklassen (Klassifikation von Nizza, Klassen 01 bis 45), für die eine Marke angemeldet oder eingetragen wurde. Gesucht werden Marken, die für mindestens eine der hier angegebenen Klassen (01 bis 45) angemeldet oder eingetragen wurden. Mehrere Klassen sind mit einem Leerzeichen zu trennen." [ref=f2e141] [cursor=pointer]: "?"
            - group [ref=f2e142]:
              - textbox "Klasse(n)" [ref=f2e143]:
                - /placeholder: z.B. 9
              - button "Auswahl Klasse(n)" [expanded] [ref=f2e145] [cursor=pointer]
          - generic [ref=f2e148]:
            - generic [ref=f2e149] [cursor=pointer]: Bildklasse(n)
            - button "Hilfe zum Feld Bildklasse(n). Das Eingabefeld betrifft die Bildklassen (Wiener Bildklassifikation), denen die Bildelemente einer Marke zugeordnet sind. Gesucht werden Marken mit Bildelementen, auf die alle hier angegebenen Bildklassen zutreffen. Bildklassen werden im Format NN.NN bzw. NN.NN.NN angegeben, zum Beispiel 05.01 (Bäume und Sträucher) oder 26.15.07 (Pyramiden). Mehrere Bildklassen sind mit einem Leerzeichen zu trennen." [ref=f2e151] [cursor=pointer]: "?"
            - group [ref=f2e152]:
              - textbox "Bildklasse(n)" [ref=f2e153]:
                - /placeholder: z.B. 26.13.01
              - button "Auswahl Bildklasse(n)" [expanded] [ref=f2e155] [cursor=pointer]
          - generic [ref=f2e158]:
            - generic [ref=f2e159] [cursor=pointer]: Filter
            - button "Hilfe zum Feld Filter. Die Checkbox Filter ermöglicht eine Einschränkung der Suche. Die Beschränkung auf Angemeldete und eingetragene Marken klammert bei der Suche alle Marken aus, die nicht zur Eintragung gelangt sind oder nicht mehr eingetragen (gelöscht) sind." [ref=f2e161] [cursor=pointer]: "?"
            - generic [ref=f2e164] [cursor=pointer]:
