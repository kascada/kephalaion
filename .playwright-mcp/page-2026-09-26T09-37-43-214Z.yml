            - generic [ref=f2e71] [cursor=pointer]: Datenbestand
            - button "Hilfe zum Feld Datenbestand. Die Checkboxen betreffen den Datenbestand, in dem eine Marke enthalten ist. Gesucht werden je nach Auswahl nationale Marken (D E), Unionsmarken (EM) und internationale Marken (IR)." [ref=f2e73] [cursor=pointer]: "?"
