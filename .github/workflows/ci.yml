name: CI

# Jeder Push und jeder Pull Request: Format, vet, Tests und der Cross-Build
# aller vier Plattformen — über dieselben Make-Targets wie lokal. Der Lauf
# ändert nichts und veröffentlicht nichts.

on:
  # Nur Branches: ein Tag läuft durch release.yml, das selbst prüft.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Kein stiller Griff zu einer anderen Toolchain: gebaut wird genau die
      # aus go.mod, sonst scheitert check-toolchain.
      GOTOOLCHAIN: local

    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Die toolchain-Zeile, nicht die go-Direktive: go-version-file nähme die
      # go-Direktive und installierte irgendeine passende Version.
      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version" || { echo "In go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          # Noch ohne Abhängigkeiten und damit ohne go.sum.
          cache-dependency-path: go.mod

      - name: Toolchain prüfen
        run: make check-toolchain

      - name: make check
        run: make check

      - name: make dist
        run: make dist

      # shellcheck ist auf den Ubuntu-Runnern vorinstalliert; lokal läuft
      # in make check nur sh -n.
      - name: shellcheck install.sh
        run: |
          set -eu
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -n 2
          shellcheck install.sh
